<!-- Ingredients -->
<p><strong>Ingredients</strong></p>
<ul>
	<li>&frac12 C Mayonnaise
	<li>2 tsp mustard
	<li>1 tsp lemon juice
	<li>2 tbs honey
	<li>1 tbs BBQ sauce
</ul>

<!-- Directions -->
<p><strong>Directions</strong></p>
<ol>
  <li>Whisk all ingredients together and serve. Store in the refrigerator
</ol>
