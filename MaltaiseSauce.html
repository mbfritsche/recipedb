<h2>Maltaise Sauce</h2>

<!-- Ingredients -->
<p><strong>Ingredients</strong></p>
<ul>
	<li>1 qt <a href="HollandaiseSauce.html" target="_blank">Hollandaise sauce</a>
	<li>4 fl oz orange juice
	<li>2 tsp orange zest
</ul>

<!-- Directions -->
<p><strong>Directions</strong></p>
<ol>
  <li>Add juice to <a href="HollandaiseSauce.html" target="_blank">Hollandaise sauce</a> and whisk together with grated orange zest
</ol>
