<!-- Ingredients -->
<p><strong>Ingredients</strong></p>
<ul>
	<li>&frac34 C whipping cream
	<li>&frac14 C Creole mustard
	<li>&frac14 C sour cream
</ul>

<!-- Directions -->
<p><strong>Directions</strong></p>
<ol>
  <li>In a small saucepan, bring the cream to a low boil over medium heat. Whisk in the mustard and sour cream and simmer for 5 minutes. Hold warm.
</ol>
