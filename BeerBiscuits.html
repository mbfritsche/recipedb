<!-- Title and picture -->
<h2>Beer Biscuits</h2>
<img src="AriRainbow.jpg" style="float:right;width:200px;height:200px;alt="Ari's Rainbow">

<!-- Ingredients -->
<p><strong>Ingredients</strong></p>
<ul>
	<li>4 C Bisquick
	<li>12 oz beer
	<li>2 tbs sugar
</ul>

<!-- Directions -->
<p><strong>Directions</strong></p>
<ol>
  <li>Mix ingredients together, drop onto a greased cookie sheet, and top the biscuits with melted butter
  <li>Bake at 450&deg for 10-12 minutes
</ol>
