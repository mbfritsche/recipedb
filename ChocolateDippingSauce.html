<!-- Title and picture -->
<h2>Chocolate Dipping Sauce</h2>
<img src="AriRainbow.jpg" style="float:right;width:200px;height:200px;alt="Ari's Rainbow">

<!-- Ingredients -->
<p><strong>Ingredients</strong></p>
<ul>
	<li>4 oz semi-sweet chocolate
	<li>2 oz unsweetened chocolate
	<li>1 tsp vegetable oil
</ul>

<!-- Directions -->
<p><strong>Directions</strong></p>
<ol>
  <li>Melt the chocolate slowly over low heat. Add the oil and stir briskly until shiny. 
</ol>
