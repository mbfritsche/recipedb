<!-- Title and picture -->
<h2>Citrus Vinaigrette</h2>
<img src="AriRainbow.jpg" style="float:right;width:250px;height:300px;alt="Ari's Rainbow">

<!-- Ingredients -->
<p><strong>Ingredients</strong></p>
<ul>
	<li>2 tbs orange juice
	<li>2 tbs olive oil
	<li>2 tbs apple cider vinegar
	<li>2 tbs honey
	<li>1 tsp Dijon mustard
</ul>

<!-- Directions -->
<p><strong>Directions</strong></p>
<ol>
  <li>Combine all ingredients together and whisk until well incorporated
</ol>
