<!-- Title and picture -->
<h2>Mustard Salad Dressing</h2>
<img src="AriRainbow.jpg" style="float:right;width:200px;height:200px;alt="Ari's Rainbow">

<!-- Ingredients -->
<p><strong>Ingredients</strong></p>
<ul>
	<li>80 ml olive oil
	<li>2 tablespoons white wine
	<li>&frac12 clove garlic, chopped
	<li>1 teaspoon mustard
	<li>Juice of &frac12 lemon
	<li>Salt
	<li>Pepper
</ul>

<!-- Directions -->
<p><strong>Directions</strong></p>
<ol>
  <li>Combine all ingredients. Pour over salad and toss. Season to taste.
</ol>
